<div style="font-family: Arial, sans-serif; background:#f4f6f8; padding:20px">

  <table width="100%" cellpadding="0" cellspacing="0" 
         style="max-width:600px;margin:auto;background:#ffffff;border-radius:8px;padding:20px">

    <tr>
      <td style="text-align:center;padding-bottom:20px">
        <h2 style="color:#2c3e50;margin:0">New Contact Message</h2>
        <p style="color:#777;margin-top:5px">
          Someone submitted a message from TrustyPlots website
        </p>
      </td>
    </tr>

    <tr>
      <td>

        <table width="100%" cellpadding="10" cellspacing="0" style="border-collapse:collapse">

          <tr>
            <td style="font-weight:bold;width:120px">Name</td>
            <td>{{name}}</td>
          </tr>

          <tr>
            <td style="font-weight:bold">Email</td>
            <td>{{email}}</td>
          </tr>

          <tr>
            <td style="font-weight:bold">Phone</td>
            <td>{{phone}}</td>
          </tr>

          <tr>
            <td style="font-weight:bold">Message</td>
            <td style="background:#f8f9fa;border-radius:4px">
              {{message}}
            </td>
          </tr>

        </table>

      </td>
    </tr>

    <tr>
      <td style="padding-top:30px;text-align:center;color:#999;font-size:12px">
        © {{year}} TrustyPlots.com
      </td>
    </tr>

  </table>

</div>
